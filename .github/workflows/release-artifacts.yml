name: Release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Build the wheel twice
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.2"
          rm -rf "$RUNNER_TEMP/hermes-m365-build-a" "$RUNNER_TEMP/hermes-m365-build-b" dist
          python -m pip wheel . --no-deps --no-cache-dir --wheel-dir "$RUNNER_TEMP/hermes-m365-build-a"
          python -m pip wheel . --no-deps --no-cache-dir --wheel-dir "$RUNNER_TEMP/hermes-m365-build-b"
          wheel_a=$(find "$RUNNER_TEMP/hermes-m365-build-a" -maxdepth 1 -name '*.whl' -print -quit)
          wheel_b=$(find "$RUNNER_TEMP/hermes-m365-build-b" -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel_a" && test -n "$wheel_b"
          test "$(basename "$wheel_a")" = "$(basename "$wheel_b")"
          test "$(sha256sum "$wheel_a" | cut -d' ' -f1)" = "$(sha256sum "$wheel_b" | cut -d' ' -f1)"
          mkdir -p dist
          cp "$wheel_a" dist/

      - name: Isolated install smoke test
        run: python scripts/release_smoke.py dist/*.whl

      - name: Generate lockfile-derived SBOM
        run: python scripts/generate_sbom.py --output dist/hermes-microsoft365-plugin.cdx.json

      - name: Write SHA-256 checksums
        working-directory: dist
        run: sha256sum *.whl *.cdx.json > SHA256SUMS

      - name: Upload release evidence (not a publication)
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.3
        with:
          name: hermes-microsoft365-plugin-release-evidence
          path: dist/
          if-no-files-found: error
          retention-days: 14
