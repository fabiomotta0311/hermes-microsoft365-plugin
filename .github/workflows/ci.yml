name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The project declares >=3.11,<3.14. Keep this matrix to supported,
        # secret-free environments; Hermes is not tested on macOS here.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check out the pinned Hermes host contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: NousResearch/hermes-agent
          ref: 948e9706618220839a20c33c2fc5c19de074d835 # pragma: allowlist secret
          path: _upstream/hermes-agent
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Check the committed uv lock
        run: |
          python -m pip install --disable-pip-version-check "uv==0.9.18"
          uv lock --check
      - name: Install exact tested toolchain
        run: |
          python -m pip install --upgrade "pip==25.2"
          # Hermes deliberately refuses wheel/sdist builds; development hosts
          # must be installed editable from a reviewed checkout.
          python -m pip install -e _upstream/hermes-agent
          python -m pip install -e ".[test]"
          python -m pip check
          python - <<'PY'
          import importlib.metadata as metadata
          expected = {
              "hermes-agent": "0.21.3",
              "msgraph-sdk": "1.62.0",
              "azure-identity": "1.25.3",
              "microsoft-kiota-abstractions": "1.12.3",
              "microsoft-kiota-http": "1.12.3",
              "microsoft-kiota-serialization-json": "1.12.3",
          }
          for package, version in expected.items():
              actual = metadata.version(package)
              assert actual == version, (package, actual, version)
          PY
      - name: Unit and strict SDK contract tests with coverage
        run: |
          python -m pytest -q \
            --cov=microsoft365 \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=90
      - name: Native plugin validation
        run: |
          python -m hermes_cli.plugin_validate microsoft365
          hermes plugins doctor microsoft365 --ci
      - name: Compile and build package
        run: |
          python -m compileall -q microsoft365
          rm -rf dist
          python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install the built wheel in a clean environment
        run: python scripts/release_smoke.py dist/*.whl
      - name: Audit the built wheel dependency environment
        run: |
          python -m venv "$RUNNER_TEMP/hermes-m365-audit"
          audit_python="$RUNNER_TEMP/hermes-m365-audit/bin/python"
          "$audit_python" -m pip install --disable-pip-version-check --upgrade pip setuptools "pip-audit==2.9.0"
          "$audit_python" -m pip install --disable-pip-version-check dist/*.whl
          "$audit_python" -m pip check
          "$audit_python" -m pip_audit --progress-spinner off
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.3
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
      - name: Secret scan
        run: |
          # Scope note: detect-secrets scans git-tracked files, so vendored or ignored
          # trees are normally out of scope already. The exclusions below keep that true
          # in a developer checkout that also carries the pinned Hermes source, a venv
          # or build output, where the vendored tree does contain redaction fixtures and
          # keyword literals that are not this plugin's code.
          detect-secrets scan \
            --exclude-files '(_upstream|\.venv|venv|dist|build|node_modules|\.git)/' \
            > "$RUNNER_TEMP/secrets.json"
          python - <<'PY'
          import json, os, sys
          path = os.path.join(os.environ["RUNNER_TEMP"], "secrets.json")
          findings = json.load(open(path))["results"]
          if findings:
              for name in sorted(findings):
                  kinds = sorted({item["type"] for item in findings[name]})
                  print(f"::error file={name}::{', '.join(kinds)}")
              sys.exit(1)
          print("secret scan: 0 findings")
          PY
      - name: Diff hygiene
        run: git diff --check

  # Stable required check for branch protection. The matrix job names above are
  # version-dependent (test (3.11), test (3.12), ...), so the protection rule
  # pins this single gate instead. It runs even when the matrix is skipped or
  # cancelled and fails unless every matrix job succeeded.
  ci-gate:
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the full CI matrix to pass
        run: |
          result="${{ needs.test.result }}"
          if [ "$result" = "success" ]; then
            echo "ci-gate: matrix passed"
          else
            echo "::error::ci-gate: matrix result was '$result' (expected success)"
            exit 1
          fi
