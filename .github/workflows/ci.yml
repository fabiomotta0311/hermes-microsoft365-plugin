name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned Hermes host contract
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 948e9706618220839a20c33c2fc5c19de074d835  # pragma: allowlist secret
          path: _upstream/hermes-agent
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact tested toolchain
        run: |
          python -m pip install --upgrade "pip==25.2"
          # Hermes deliberately refuses wheel/sdist builds; development hosts
          # must be installed editable from a reviewed checkout.
          python -m pip install -e _upstream/hermes-agent
          python -m pip install -e ".[test]"
          python -m pip check
          python - <<'PY'
          import importlib.metadata as metadata
          expected = {
              "hermes-agent": "0.21.3",
              "msgraph-sdk": "1.62.0",
              "azure-identity": "1.25.3",
              "microsoft-kiota-abstractions": "1.12.3",
              "microsoft-kiota-http": "1.12.3",
              "microsoft-kiota-serialization-json": "1.12.3",
          }
          for package, version in expected.items():
              actual = metadata.version(package)
              assert actual == version, (package, actual, version)
          PY
      - name: Unit and strict SDK contract tests
        run: python -m pytest -q
      - name: Native plugin validation
        run: |
          python -m hermes_cli.plugin_validate microsoft365
          hermes plugins doctor microsoft365 --ci
      - name: Compile and build package
        run: |
          python -m compileall -q microsoft365
          python -m pip wheel . --no-deps --wheel-dir dist
      - name: Secret scan
        run: |
          # Scope note: detect-secrets scans git-tracked files, so vendored or ignored
          # trees are normally out of scope already. The exclusions below keep that true
          # in a developer checkout that also carries the pinned Hermes source, a venv
          # or build output, where the vendored tree does contain redaction fixtures and
          # keyword literals that are not this plugin's code.
          detect-secrets scan \
            --exclude-files '(_upstream|\.venv|venv|dist|build|node_modules|\.git)/' \
            > "$RUNNER_TEMP/secrets.json"
          python - <<'PY'
          import json, os, sys
          path = os.path.join(os.environ["RUNNER_TEMP"], "secrets.json")
          findings = json.load(open(path))["results"]
          if findings:
              for name in sorted(findings):
                  kinds = sorted({item["type"] for item in findings[name]})
                  print(f"::error file={name}::{', '.join(kinds)}")
              sys.exit(1)
          print("secret scan: 0 findings")
          PY
      - name: Diff hygiene
        run: git diff --check
