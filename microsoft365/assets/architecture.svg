<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft 365 plugin trust boundaries</title>
  <desc id="desc">Opt-in configuration selects supported operations. The Hermes host approval gate precedes Graph client construction. Unsupported and unimplemented operations stay in administrative preflight and do not register active schemas.</desc>
  <defs>
    <style>.bg{fill:#0f172a}.box{fill:#1e293b;stroke:#94a3b8;stroke-width:2}.gate{fill:#164e63;stroke:#67e8f9;stroke-width:3}.stop{fill:#4c1d1d;stroke:#fca5a5;stroke-width:2}text{font-family:Segoe UI,Arial,sans-serif;fill:#f8fafc}.label{font-size:22px;font-weight:600}.small{font-size:16px;fill:#cbd5e1}.arrow{stroke:#cbd5e1;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:9 8}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#cbd5e1"/></marker>
  </defs>
  <rect class="bg" width="1200" height="680"/><text x="60" y="55" class="label">Microsoft 365 plugin — pre-release control flow</text>
  <rect class="box" x="60" y="145" width="230" height="115" rx="14"/><text x="175" y="187" text-anchor="middle" class="label">Opt-in settings</text><text x="175" y="220" text-anchor="middle" class="small">strict booleans + auth mode</text>
  <rect class="box" x="345" y="145" width="240" height="115" rx="14"/><text x="465" y="187" text-anchor="middle" class="label">Active schemas</text><text x="465" y="220" text-anchor="middle" class="small">supported + implemented only</text>
  <rect class="gate" x="640" y="125" width="255" height="155" rx="14"/><text x="768" y="174" text-anchor="middle" class="label">Hermes host gate</text><text x="768" y="207" text-anchor="middle" class="small">approval owns write policy</text><text x="768" y="236" text-anchor="middle" class="small">final-args core fix required</text>
  <rect class="box" x="950" y="145" width="190" height="115" rx="14"/><text x="1045" y="187" text-anchor="middle" class="label">Graph SDK</text><text x="1045" y="220" text-anchor="middle" class="small">typed builders/models</text>
  <path class="arrow" d="M290 202 H345"/><path class="arrow" d="M585 202 H640"/><path class="arrow" d="M895 202 H950"/>
  <rect class="stop" x="345" y="350" width="330" height="125" rx="14"/><text x="510" y="392" text-anchor="middle" class="label">Administrative preflight</text><text x="510" y="425" text-anchor="middle" class="small">unsupported / unverified retained</text><text x="510" y="451" text-anchor="middle" class="small">no empty action enum</text><path class="arrow dash" d="M465 260 V350"/>
  <text x="60" y="575" class="small">Secret reads occur only at execution/preflight through agent.secret_scope.</text><text x="60" y="605" class="small">Offline tests do not claim tenant authentication, consent, or remote behavior.</text>
</svg>
